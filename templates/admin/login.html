<!DOCTYPE html>

<html>
<head>
    <title>Eden NAC - Administrator Login</title>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background:
            radial-gradient(
                circle at top,
                #1e293b,
                #020617 70%
            );

        color: white;
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        height: 100vh;
    }

    .box {

        background: rgba(2, 6, 23, 0.96);

        width: 400px;

        padding: 45px;

        border-radius: 18px;

        border: 1px solid #334155;

        box-shadow:
            0 0 35px rgba(239, 68, 68, 0.15);

        backdrop-filter: blur(10px);
    }

    .logo {

        text-align: center;

        font-size: 55px;

        margin-bottom: 15px;
    }

    .admin-label {

        text-align: center;

        color: #ef4444;

        font-size: 12px;

        font-weight: bold;

        letter-spacing: 2px;

        margin-bottom: 8px;

        text-transform: uppercase;
    }

    h2 {

        text-align: center;

        margin-bottom: 10px;

        font-size: 30px;

        color: #f8fafc;
    }

    .subtitle {

        text-align: center;

        color: #94a3b8;

        margin-bottom: 25px;

        font-size: 14px;
    }

    input {

        width: 100%;

        padding: 14px;

        margin-top: 15px;

        border: 1px solid #334155;

        border-radius: 10px;

        background: #0f172a;

        color: white;

        font-size: 15px;

        outline: none;

        transition: 0.3s;
    }

    input:focus {

        border: 1px solid #ef4444;

        box-shadow:
            0 0 10px rgba(239, 68, 68, 0.25);
    }

    button {

        width: 100%;

        padding: 14px;

        margin-top: 18px;

        border: none;

        border-radius: 10px;

        background: #dc2626;

        color: white;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    button:hover {

        transform: translateY(-2px);

        background: #ef4444;

        box-shadow:
            0 0 15px rgba(239, 68, 68, 0.35);
    }

    .server-status {

        text-align: center;

        margin-top: 25px;

        padding-top: 18px;

        border-top: 1px solid #1e293b;

        color: #64748b;

        font-size: 12px;
    }

    .status-dot {

        display: inline-block;

        width: 7px;

        height: 7px;

        background: #22c55e;

        border-radius: 50%;

        margin-right: 6px;
    }

    #snackbar {

        visibility: hidden;

        min-width: 300px;

        text-align: center;

        border-radius: 10px;

        padding: 18px;

        position: fixed;

        left: 50%;

        bottom: 30px;

        transform: translateX(-50%);

        color: white;

        font-weight: bold;

        z-index: 999;
    }

    #snackbar.show {

        visibility: visible;
    }

</style>


</head>

<body>

<div class="box">

<div class="logo">
    🛡️
</div>

<div class="admin-label">
    Administrator Access
</div>

<h2>
    Eden NAC
</h2>

<p class="subtitle">
    Network Access Control Management Console
</p>


<form id="loginForm">

    <input
        type="text"
        name="username"
        placeholder="Administrator Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Administrator Password"
        required
    >

    <button type="submit">
        Access Management Console
    </button>

</form>


<div class="server-status">

    <span class="status-dot"></span>

    NAC Server Management Interface

</div>



<div id="snackbar"></div>

<script>

const form = document.getElementById("loginForm");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData(form);

    const response = await fetch("/admin", {
        method: "POST",
        body: formData
    });

    const snackbar = document.getElementById("snackbar");

    if (response.ok) {

        window.location.href = "/dashboard";

        return;
    }

    const data = await response.text();

    snackbar.innerText = data;

    snackbar.style.background = "#dc2626";

    snackbar.className = "show";

    setTimeout(() => {

        snackbar.className =
            snackbar.className.replace("show", "");

    }, 3000);

});

</script>

</body>
</html>
