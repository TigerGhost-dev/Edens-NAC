<!DOCTYPE html>
<html>
<head>
    <title>Eden NAC Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #1e293b
                );

            color:white;
            font-family:Arial, Helvetica, sans-serif;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;
        }

        .box{

            background:rgba(30,41,59,0.95);

            width:400px;

            padding:45px;

            border-radius:18px;

            box-shadow:
                0 0 30px rgba(56,189,248,0.2);

            backdrop-filter:blur(10px);
        }

        h2{
            text-align:center;

            margin-bottom:30px;

            font-size:30px;

            color:#38bdf8;
        }

        .subtitle{
            text-align:center;

            color:#cbd5e1;

            margin-bottom:25px;

            font-size:14px;
        }

        input{

            width:100%;

            padding:14px;

            margin-top:15px;

            border:none;

            border-radius:10px;

            background:#334155;

            color:white;

            font-size:15px;

            outline:none;

            transition:0.3s;
        }

        input:focus{

            border:1px solid #38bdf8;

            box-shadow:
                0 0 10px rgba(56,189,248,0.4);
        }

        button{

            width:100%;

            padding:14px;

            margin-top:18px;

            border:none;

            border-radius:10px;

            background:#38bdf8;

            color:white;

            font-size:15px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-2px);

            background:#0ea5e9;

            box-shadow:
                0 0 15px rgba(56,189,248,0.5);
        }

        .register-btn{

            background:#1e40af;
        }

        .register-btn:hover{

            background:#2563eb;
        }

        #snackbar{

            visibility:hidden;

            min-width:300px;

            text-align:center;

            border-radius:10px;

            padding:18px;

            position:fixed;

            left:50%;

            bottom:30px;

            transform:translateX(-50%);

            color:white;

            font-weight:bold;

            z-index:999;
        }

        #snackbar.show{
            visibility:visible;
        }

        .logo{

            text-align:center;

            font-size:55px;

            margin-bottom:15px;
        }

    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        🔐
    </div>

    <h2>Eden NAC</h2>

    <p class="subtitle">
        Secure Network Access Control System
    </p>

    <form id="loginForm">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <button
        class="register-btn"
        onclick="window.location.href='/register'"
    >
        Register Device
    </button>

</div>

<div id="snackbar"></div>

<script>

const form = document.getElementById("loginForm");

form.addEventListener("submit", async function(e){

    e.preventDefault();

    const formData = new FormData(form);

    const response = await fetch("/login", {
        method:"POST",
        body:formData
    });

    const data = await response.json();

    const snackbar = document.getElementById("snackbar");

    snackbar.innerText = data.message;

    snackbar.style.background =
        data.success ? "#16a34a" : "#dc2626";

    snackbar.className = "show";

    setTimeout(() => {

        snackbar.className =
            snackbar.className.replace("show", "");

    }, 3000);

    if(data.success){

        setTimeout(() => {

            window.location.href = "/dashboard";

        }, 1500);
    }

});

</script>

</body>
</html>
